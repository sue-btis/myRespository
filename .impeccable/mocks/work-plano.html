<!doctype html>
<html lang="en" data-face="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work mock, Annotated blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Doto:wght@100..900&family=Funnel+Display:wght@300..800&family=Michroma&family=Unbounded:wght@200..900&display=swap">
<style>
@property --ground{syntax:'<color>';inherits:true;initial-value:#ECECEC}
@property --ground-2{syntax:'<color>';inherits:true;initial-value:#F7F7F7}
@property --ink{syntax:'<color>';inherits:true;initial-value:#16324A}
@property --ink-2{syntax:'<color>';inherits:true;initial-value:#3E5568}
@property --signal{syntax:'<color>';inherits:true;initial-value:#F78888}
@property --on-signal{syntax:'<color>';inherits:true;initial-value:#16324A}
@property --cta{syntax:'<color>';inherits:true;initial-value:#16324A}
@property --on-cta{syntax:'<color>';inherits:true;initial-value:#ECECEC}
@property --rule{syntax:'<color>';inherits:true;initial-value:#16324A2E}
:root{
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --spring:linear(0,.06 2%,.23 5%,.5 9%,.78 14%,.95 19%,1.035 25%,1.045 30%,1.02 40%,.995 55%,1.002 70%,1);
  --body:"Archivo",system-ui,sans-serif;--gutter:clamp(16px,4vw,56px);--bar-h:56px;--radius:3px;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  transition:--ground .6s,--ground-2 .6s,--ink .6s,--ink-2 .6s,--signal .6s,--on-signal .6s,--cta .6s,--on-cta .6s,--rule .6s;
}
html[data-face="neutral"]{--ground:#ECECEC;--ground-2:#F7F7F7;--ink:#16324A;--ink-2:#3E5568;--signal:#F78888;--on-signal:#16324A;--cta:#16324A;--on-cta:#ECECEC;--rule:#16324A2E;--display:"Archivo",system-ui,sans-serif;--display-wdth:118;--display-wght:780;--display-track:-.035em;--k:1;--texture:none}
html[data-face="fullstack"]{--ground:#C4DBF6;--ground-2:#D7E6F9;--ink:#14264A;--ink-2:#33476B;--signal:#B23850;--on-signal:#F7EFF1;--cta:#B23850;--on-cta:#F7EFF1;--rule:#14264A2E;--display:"Funnel Display",system-ui,sans-serif;--display-wdth:100;--display-wght:800;--display-track:-.025em;--k:1.04;--texture:none}
html[data-face="ai"]{--ground:#304C64;--ground-2:#26425A;--ink:#CFE6EA;--ink-2:#A4CCD4;--signal:#E2480C;--on-signal:#1A0703;--cta:#A4CCD4;--on-cta:#1F3445;--rule:#A4CCD42E;--display:"Unbounded",system-ui,sans-serif;--display-wdth:100;--display-wght:600;--display-track:-.03em;--k:.86;--texture:radial-gradient(#A4CCD41F 1px,transparent 1.4px) 0 0/22px 22px}
html[data-face="data"]{--ground:#EDE8F5;--ground-2:#E1DDF0;--ink:#26346B;--ink-2:#3D52A0;--signal:#7091E6;--on-signal:#121A3A;--cta:#3D52A0;--on-cta:#EDE8F5;--rule:#3D52A033;--display:"Doto",ui-monospace,monospace;--display-wdth:100;--display-wght:900;--display-track:-.02em;--k:.9;--texture:repeating-linear-gradient(180deg,transparent 0 39px,#8697C42E 39px 40px)}
html[data-face="design"]{--ground:#141414;--ground-2:#1E1E1E;--ink:#F2F0EE;--ink-2:#C9C4C0;--signal:#ED7845;--on-signal:#141414;--cta:#F95CA4;--on-cta:#141414;--rule:#F2F0EE24;--display:"Michroma",system-ui,sans-serif;--display-wdth:100;--display-wght:400;--display-track:0em;--k:.8;--texture:linear-gradient(#F2F0EE0F 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#F2F0EE0F 1px,transparent 1px) 0 0/40px 40px}

*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{background:var(--ground);color-scheme:light;-webkit-text-size-adjust:100%}
html[data-face="ai"],html[data-face="design"]{color-scheme:dark}
body{background:var(--ground);color:var(--ink);font:400 1rem/1.55 var(--body);overflow-x:clip;min-height:100svh}
body::before{content:"";position:fixed;inset:0;background:var(--texture);pointer-events:none;z-index:0}
main,.bar{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
ul,ol{list-style:none;padding:0}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.display{font-family:var(--display);font-weight:var(--display-wght);font-variation-settings:"wdth" var(--display-wdth);letter-spacing:var(--display-track);line-height:.94;text-wrap:balance}
.dl{font:600 .72rem/1.2 var(--body);font-stretch:82%;font-variation-settings:"wdth" 82;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}

.bar{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--bar-h);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--gutter);background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--rule)}
.bar__tag{font-size:.8125rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.faces{display:flex;gap:4px;padding:3px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--rule)}
.faces button{min-height:40px;padding:0 14px;border:0;border-radius:99px;background:transparent;font-size:.8125rem;font-weight:650;transition:background .3s,color .3s}
.faces button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta)}
@media (max-width:640px){.bar__tag{display:none}.bar{justify-content:center}.faces button{padding:0 9px;font-size:.75rem}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:44px;padding:0 20px;border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--cta);color:var(--on-cta);font-size:.9375rem;font-weight:700;text-decoration:none;transition:transform .35s var(--spring),box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px color-mix(in srgb,var(--ink) 55%,transparent)}
.btn:active{transform:scale(.97)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--pending{background:transparent;color:var(--ink-2);border:1.5px dashed var(--ink-2);cursor:default}
.btn--pending:hover{transform:none;box-shadow:none}

.work{padding:calc(var(--bar-h) + clamp(28px,4vw,56px)) var(--gutter) clamp(48px,7vw,96px)}
.work__head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 40px;margin-bottom:clamp(20px,3vw,36px)}
.work__head h2{font-size:calc(clamp(3rem,9vw,6.5rem) * var(--k))}
.work__note{max-width:34rem;color:var(--ink-2)}
.sel{display:grid;gap:18px;align-items:start}
@media (min-width:1100px){.sel{grid-template-columns:250px minmax(0,1fr);gap:32px}.sel__side{position:sticky;top:calc(var(--bar-h) + 20px)}}
.sel__side .dl{display:block;margin-bottom:8px}
.sel__list{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (min-width:700px) and (max-width:1099px){.sel__list{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.sel__list{grid-template-columns:1fr}}
.tab{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;text-align:left;min-height:64px;padding:10px 14px;border:1.5px solid var(--rule);border-radius:6px;background:transparent;transition:background .3s,color .3s,border-color .3s,transform .4s var(--spring)}
.tab:hover{border-color:var(--ink-2);transform:translateX(4px)}
.tab__n{grid-row:1/3;font-family:var(--display);font-variation-settings:"wdth" var(--display-wdth);font-weight:var(--display-wght);font-size:calc(1.4rem * var(--k));line-height:1;color:var(--ink-2)}
.tab__t{font-weight:700;line-height:1.2;align-self:end}
.tab__m{font-size:.8125rem;color:var(--ink-2);align-self:start}
.tab[aria-selected="true"]{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.tab[aria-selected="true"] .tab__n,.tab[aria-selected="true"] .tab__m{color:var(--on-cta)}
.tab--wip{border-style:dashed;border-color:var(--ink-2)}
@media (max-width:699px){.tab{grid-template-columns:1fr;gap:2px;min-height:84px}.tab__n{grid-row:auto;font-size:1.1rem}.tab:hover{transform:none}}

/* sheet */
.panel{min-width:0}
.sheet{container:sheet/inline-size;position:relative;overflow:hidden;background:var(--ground-2);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 30px 60px -40px rgba(8,14,28,.5);
  --pw:calc(var(--ph) / 2.1641);--ph:440px}
.sheet svg{display:block}
.frame{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ov{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.cl{position:absolute;inset:0;z-index:4;pointer-events:none}
.sheet__in{position:relative;z-index:1;padding:46px 48px 46px}
.dr{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:1 1;stroke-dashoffset:0}
.dr.thin{stroke-width:1}.dr.bold{stroke-width:2.25}
.halo{fill:none;stroke:var(--ground-2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.gd{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:2 7}
.zl{font:600 11.5px var(--body);font-variation-settings:"wdth" 82;fill:var(--ink-2);text-anchor:middle}
.st{font:600 12px var(--body);font-variation-settings:"wdth" 85;letter-spacing:.06em;fill:var(--ink-2);text-anchor:middle}
.rg-tint{fill:color-mix(in srgb,var(--signal) 24%,transparent)}
.rg-main{fill:none;stroke:var(--ink);stroke-width:2}
.bl{fill:var(--signal);stroke:var(--ink);stroke-width:1.5}
.bt{font:800 12.5px var(--body);fill:var(--on-signal);text-anchor:middle}
.dot{fill:var(--ink);stroke:var(--ground-2);stroke-width:1.5}
.sheet:not(.still) .dr{animation:drawn var(--t,900ms) var(--ease-io) calc(var(--d,0) * 1ms) both}
.sheet:not(.still) .fi{animation:fadein .6s ease calc(var(--d,0) * 1ms) both}
.sheet:not(.still) .pop{transform-box:fill-box;transform-origin:center;animation:popin .55s var(--spring) calc(var(--d,0) * 1ms) both}
.sheet:not(.still) .wipe{animation:wipe .9s var(--ease-out) calc(var(--d,0) * 1ms) both}
.sheet:not(.still) .slide{animation:slidein .7s var(--ease-out) calc(var(--d,0) * 1ms) both}
.gco{transition:opacity .22s}
.gco.leave{opacity:0}
@keyframes drawn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(0);opacity:0}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}}
@keyframes slidein{from{opacity:0;transform:translateX(-26px)}}

.stage{min-width:0}
.stage--shots{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:start}
.vis{display:grid;gap:8px}
.vi{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;gap:0 10px;align-items:center;text-align:left;padding:6px;border:1.5px solid var(--rule);border-radius:3px;background:transparent;min-height:44px;transition:border-color .25s,background .25s}
.vi img{grid-row:1/3;width:30px;height:auto;aspect-ratio:780/1688;object-fit:cover;box-shadow:0 0 0 1px var(--rule)}
.vi b{font-size:.8125rem;line-height:1.15;align-self:start}
.vi .dl{align-self:end}
.vi:hover{border-color:var(--ink-2)}
.vi[aria-current="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.vst{display:grid;grid-template-rows:44px var(--ph) 40px;justify-items:center;min-width:0}
.vl{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.vt{min-width:11.5em;text-align:center;color:var(--ink);font-size:.8rem;white-space:nowrap}
.vt em{font-style:normal;color:var(--ink-2);margin-left:.6em}
.ib{width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;background:transparent;transition:background .25s,color .25s,transform .35s var(--spring)}
.ib:hover{background:var(--ink);color:var(--ground-2);transform:scale(1.07)}
.ib svg{width:18px;height:18px}
.vw{position:relative;width:var(--pw);height:var(--ph)}
.ph{position:absolute;inset:0;margin:0;box-shadow:0 0 0 1.5px var(--ink);background:var(--ground-2);transition:transform .7s var(--ease-out),opacity .5s;opacity:0;transform:translateX(52px)}
.ph[data-s="before"]{transform:translateX(-52px)}
.ph[data-s="on"]{opacity:1;transform:none}
.ph img{width:100%;height:100%;object-fit:cover}

.notes{counter-reset:n;display:grid;gap:8px;font-size:.875rem;margin-top:14px}
.notes li{counter-increment:n;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.notes li::before{content:counter(n);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--signal);color:var(--on-signal);box-shadow:0 0 0 1.5px var(--ink);font-weight:800;font-size:.75rem}
.notes-wrap{display:none}
.lb{position:absolute;width:max-content;font-size:.8125rem;line-height:1.35;color:var(--ink);transform:translateY(-50%);animation:fadein .5s ease calc(var(--d,0) * 1ms) both}
.lb .dl{display:block;margin-bottom:1px}
.lb--l{text-align:right}
.sheet.still .lb{animation:none}

.foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:12px 32px;align-items:end;margin-top:18px}
.fnotes{display:grid;gap:10px;align-content:end}
.pitch{font-size:.9375rem;max-width:52ch}
.gn{counter-reset:g;display:grid;gap:3px;font-size:.8125rem;color:var(--ink-2)}
.gn li{counter-increment:g}
.gn li::before{content:"N" counter(g) " ";font-weight:800;color:var(--ink);letter-spacing:.06em}
.gn b{color:var(--ink);font-weight:650}
.links{display:flex;flex-wrap:wrap;gap:10px}
.tbw{position:relative}
.tb{display:grid;grid-template-columns:repeat(6,1fr);border:1.75px solid var(--ink);background:var(--ground-2)}
.tc{display:grid;gap:1px;padding:6px 10px 7px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-width:0}
.tc:nth-child(n+1){}
.tc b{font-size:.875rem;line-height:1.2;overflow-wrap:anywhere}
.tc--proj{grid-column:1/5}.tc--sht{grid-column:5/7;border-right:0}
.tc--area{grid-column:1/4}.tc--slot{grid-column:4/7;border-right:0}
.tc--rev{grid-column:1/3;border-bottom:0}.tc--scale{grid-column:3/5;border-bottom:0}.tc--by{grid-column:5/7;border-right:0;border-bottom:0}
.tn{font-size:calc(1.85rem * var(--k))!important;line-height:1!important;padding-top:3px}
.stampy{position:absolute;right:10px;top:-34px;transform:rotate(-6deg);padding:4px 12px;border:3px double var(--cta);color:var(--cta);background:color-mix(in srgb,var(--ground-2) 88%,transparent);font:800 .8rem/1.1 var(--body);font-variation-settings:"wdth" 90;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;z-index:5}
.sheet:not(.still) .stampy{animation:thump .5s var(--ease-out) calc(var(--d,0) * 1ms) both}
@keyframes thump{0%{opacity:0;transform:rotate(-14deg) scale(2.1)}55%{opacity:1;transform:rotate(-6deg) scale(.94)}100%{transform:rotate(-6deg) scale(1)}}

/* flow */
.flow{position:relative;display:grid;gap:30px}
.flow>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.fls{position:relative;z-index:1;display:grid;gap:36px}
.fl{display:grid;gap:14px}
.fh{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start}
.fh i{grid-row:1/3;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--signal);color:var(--on-signal);box-shadow:0 0 0 1.5px var(--ink);font:800 .8125rem var(--body);font-style:normal}
.fh b{font-size:1.0625rem;line-height:1.2}
.fh b span{margin-left:.6em}
.fh p{font-size:.875rem;color:var(--ink-2);max-width:52ch}
.fr{display:flex;gap:44px;padding:0 34px}
.fb{flex:1 1 0;min-width:0;display:grid;align-content:center;justify-items:center;gap:2px;min-height:80px;padding:8px 10px;text-align:center;transition:color .3s}
.fb small{font:600 .72rem/1 var(--body);font-variation-settings:"wdth" 82;letter-spacing:.09em;color:var(--ink-2)}
.fb b{font-size:.9375rem;line-height:1.15}
.fb em{font:600 .72rem/1.1 var(--body);font-style:normal;color:var(--ink-2)}
.fb.on,.fb.on small,.fb.on em{color:var(--on-signal)}
.fbr{fill:var(--ground-2);transition:fill .35s}
.sheet:not(.still) .fbr{animation:drawn var(--t,700ms) var(--ease-io) calc(var(--d,0) * 1ms) both,fillin .4s ease calc(var(--d,0) * 1ms + 500ms) both}
@keyframes fillin{from{fill-opacity:0}}
.fbr.on{fill:var(--signal)}
.fbr.done{fill:color-mix(in srgb,var(--ink) 13%,var(--ground-2))}
.glow{fill:none;stroke:var(--signal);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 4;transition:opacity .3s}
.pillt{font:800 11px var(--body);fill:var(--on-cta);text-anchor:middle}
.pillb{fill:var(--cta)}
.ring{fill:none;stroke:var(--signal);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.3s ease-out infinite}
.sheet.reduced .ring{animation:none}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.sigc{fill:var(--signal);stroke:var(--ink);stroke-width:2}
.detail{position:relative;z-index:1;margin:0;display:grid;gap:6px}
.term{background:var(--ink);color:var(--ground-2);border:1.5px solid var(--ink);padding:12px 14px;font:500 .8125rem/1.65 var(--mono);height:178px;overflow:hidden;white-space:pre}
.term .ok{opacity:.9}
.term .dim{opacity:.75}

.sheet[data-kind=flow] .foot{margin-top:38px}
.stage--wip{position:relative;display:grid;gap:10px;justify-items:center}
.bvs{display:flex;gap:30px;justify-content:center;height:340px;align-items:stretch}
.bv{flex:0 0 150px;display:grid;align-content:end;justify-items:center;padding-bottom:0}
.bvl{display:flex;gap:30px;justify-content:center}
.bvl span{flex:0 0 150px;text-align:center}
.stampbig{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%) rotate(-8deg);padding:10px 26px;border:5px double var(--cta);color:var(--cta);background:color-mix(in srgb,var(--ground-2) 90%,transparent);font-family:var(--display);font-variation-settings:"wdth" var(--display-wdth);font-weight:var(--display-wght);font-size:calc(clamp(1.7rem,4.6cqw,3.4rem) * var(--k));line-height:1;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;pointer-events:none;z-index:5}
.sheet:not(.still) .stampbig{animation:thumpb .6s var(--ease-out) calc(var(--d,0) * 1ms) both}
@keyframes thumpb{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(2.2)}55%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.93)}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}

@container sheet (max-width:759px){
  .sheet{--pw:min(188px,calc((100cqw - 88px) * .66));--ph:calc(var(--pw) * 2.1641)}
  .sheet__in{padding:40px 38px 40px}
  .stage--shots{grid-template-columns:1fr}
  .vis{grid-template-columns:repeat(4,1fr);gap:6px}
  .vi{grid-template-columns:1fr;justify-items:center;gap:3px;padding:6px 2px;text-align:center}
  .vi img{grid-row:auto;width:22px;height:auto}
  .vi b{display:none}
  .vi .dl{align-self:center}
  .vt{min-width:0;font-size:.74rem}
  .vst{margin-top:6px}
  .notes-wrap{display:block}
  .foot{grid-template-columns:1fr}
  .stampy{top:-30px;right:6px}
  .tbw{margin-top:34px}.tn{font-size:1.45rem!important}
  .fls{grid-template-columns:1fr 1fr;gap:14px}
  .fh{grid-template-columns:1fr;gap:6px}.fh i{grid-row:auto}
  .fh p{display:none}.fh b span{display:block;margin:2px 0 0}
  .fr{flex-direction:column;gap:30px;padding:30px 0}
  .fb{min-height:50px;padding:6px 4px}
  .term{height:172px;font-size:.75rem;padding:10px}
  .bvs,.bvl{gap:12px}.bvs{height:230px}.bv,.bvl span{flex-basis:84px}
  .stampbig{top:100px;font-size:1.35rem;padding:8px 14px;border-width:4px}
}

  segs.forEach(([a,b],k)=>{const d=base+200+k*140,ang=Math.atan2(b.y-a.y,b.x-a.x),ah=9,aw=5.5,px=-Math.sin(ang),py=Math.cos(ang);
   dr(gp,'path',{d:`M${a.x} ${a.y}L${b.x} ${b.y}`},d,'');
   svgEl('path',{d:`M${b.x} ${b.y}L${b.x-Math.cos(ang)*ah+px*aw} ${b.y-Math.sin(ang)*ah+py*aw}L${b.x-Math.cos(ang)*ah-px*aw} ${b.y-Math.sin(ang)*ah-py*aw}Z`,fill:'var(--ink)',class:'fi',style:`--d:${d+500}`},gp)});
  svgEl('circle',{cx:inl.x,cy:inl.y,r:4,fill:'var(--ink)'},gp);
  const rects=bs.map((b,k)=>dr(gb,'rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:2},base+k*110,'fbr'));
  rects.forEach(r=>r.setAttribute('style',r.getAttribute('style')+';--t:700ms'));
  FL.pl.push({bs,n,glow,len,cum,rects,fbs:$$('.fb',sec),knots})});
 const pill=svgEl('g',{style:'opacity:0;transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .3s'},gt);
 FL.pill={g:pill,r:svgEl('rect',{class:'pill',rx:6},pill)};
 const tag=svgEl('g',{},pill);FL.pill.tag=tag;svgEl('circle',{r:9,class:'pillb'},tag);const tx=svgEl('text',{y:4,class:'pillt'},tag);tx.textContent='A';
 const sg=svgEl('g',{style:'opacity:0'},gt);svgEl('circle',{r:9,class:'ring'},sg);svgEl('circle',{r:6,class:'sigc'},sg);FL.sig=sg;
}
function flowState(clock){
 if(clock<0)return {cur:-1,p:0};
 const c=clock%CYCLE,a=STAGE_MS*5,b=a+HOLD1,e=b+STAGE_MS*6;
 if(c<a)return{cur:0,p:c/STAGE_MS};if(c<b)return{cur:0,p:5,hold:true};if(c<e)return{cur:1,p:(c-b)/STAGE_MS};return{cur:1,p:6,hold:true}}
function termText(cur,p){
 if(cur<0)return '$ idle';const pl=PLUGINS[cur],k=Math.min(Math.floor(p),pl.stages.length-1),fr=p-Math.floor(p);
 let s=`$ ${pl.name}\n`;
 for(let i=0;i<pl.stages.length;i++){if(i>k&&p<pl.stages.length)break;const t=`${String(i+1).padStart(2,'0')} ${pl.stages[i]}${pl.note[pl.stages[i]]?' ('+pl.note[pl.stages[i]]+')':''}`;
  if(i<k||p>=pl.stages.length){s+=`> ${t}  ✓\n`}else{const typed=Math.min(t.length,Math.ceil(fr/.55*t.length));s+=`> ${t.slice(0,typed)}${typed<t.length?'▌':fr>.7?'  ✓':''}\n`}}
 return s}
function renderFlow(clock,still){
 if(!FL)return;const st=still?{cur:1,p:6,hold:true}:flowState(clock),C=FL.cache;
 FL.pl.forEach((q,qi)=>{const prog=st.cur<0?0:qi<st.cur?q.n:qi===st.cur?st.p:0,idx=Math.floor(prog);
  const keyP=qi+':'+prog.toFixed(3);if(C['p'+qi]!==keyP){C['p'+qi]=keyP;
   const kn=[0,...Array.from({length:q.n},(_,i)=>i+.5),q.n];let k=1;while(k<kn.length-1&&prog>kn[k])k++;
   const f=(prog-kn[k-1])/(kn[k]-kn[k-1]||1),l=q.cum[k-1]+(q.cum[k]-q.cum[k-1])*Math.max(0,Math.min(1,f));
   q.glow.style.strokeDashoffset=q.len-(prog<=0?0:l)-(prog<=0?q.len*0:0);if(prog<=0)q.glow.style.strokeDashoffset=q.len;
   q.rects.forEach((r,i)=>{const s=prog>=q.n||i<idx?'done':i===idx&&prog>0?'on':'';r.setAttribute('class','dr fbr '+s);q.fbs[i].classList.toggle('on',s==='on')});
   if(qi===st.cur){const pt=prog<=0?q.knots[0]:(()=>{const a=q.knots[k-1],b=q.knots[k];return{x:a.x+(b.x-a.x)*Math.max(0,Math.min(1,f)),y:a.y+(b.y-a.y)*Math.max(0,Math.min(1,f))}})();
    FL.sig.setAttribute('transform',`translate(${pt.x} ${pt.y})`);const bi=Math.min(idx,q.n-1),b=q.bs[bi];FL.sig.style.opacity=still||prog<=0||(pt.x>b.x&&pt.x<b.x+b.w&&pt.y>b.y&&pt.y<b.y+b.h)?0:1;if(C.bi!==qi+':'+bi){C.bi=qi+':'+bi;const w=b.w+16,h=b.h+16;
     FL.pill.r.setAttribute('width',w);FL.pill.r.setAttribute('height',h);FL.pill.r.setAttribute('x',0);FL.pill.r.setAttribute('y',0);
     FL.pill.tag.setAttribute('transform',`translate(${w-2} 2)`);FL.pill.g.style.transform=`translate(${b.x-8}px,${b.y-8}px)`;FL.pill.g.style.opacity=prog>=q.n?0:1}}}
 });
 if(st.cur>=0&&st.hold&&FL.pill)FL.pill.g.style.opacity=0;
 const tt=termText(st.cur,st.p);if(C.t!==tt){C.t=tt;$('.term',sheet).textContent=tt}
}
function startFlow(){
 const g=gen,reduced=mq.matches;
 if(reduced){renderFlow(0,true);return}
 let last=performance.now(),clock=-START;
 const tick=now=>{if(g!==gen)return;const dt=now-last;last=now;if(vis&&!document.hidden)clock+=Math.min(dt,100);renderFlow(clock,false);raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick)}

/* wip */
function paintWip(){
 const g=$('.gdm',sheet);g.replaceChildren();const sr=sheet.getBoundingClientRect();
 $$('.bv',sheet).forEach((b,k)=>{const r=rel(b.getBoundingClientRect(),sr),d=1500+k*260;
  dr(g,'rect',{x:r.x,y:r.y,width:r.w,height:r.h},d);dr(g,'path',{d:`M${r.x} ${r.y}L${r.x+r.w} ${r.y+r.h}M${r.x+r.w} ${r.y}L${r.x} ${r.y+r.h}`},d+350,'thin')})}

/* orchestration */
function paintAll(){paintFrame();if(curP.kind==='shots'){paintDims();paintCallouts(viewIdx,0)}else if(curP.kind==='flow')paintFlow();else paintWip()}
let io=null,lastW=0,lastH=0;
function select(id){
 const i=PROJ.findIndex(p=>p.id===id),P=PROJ[i];if(!P||(curP&&curP.id===id))return;
 gen++;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);clearInterval(autoplay);clearTimeout(swapT);
 curP=P;FL=null;viewIdx=0;hold=false;
 $$('.tab',tabs).forEach(b=>{const on=b.dataset.id===id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
 panel.setAttribute('aria-labelledby','tab-'+id);
 sheet.className='sheet'+(mq.matches?' still reduced':'');sheet.dataset.kind=P.kind;
 sheet.innerHTML=(P.kind==='shots'?tplShots:P.kind==='flow'?tplFlow:tplWip)(P,i);
 const g=gen,ready=Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);
 lastW=0;
 ready.then(()=>{if(g!==gen)return;lastW=sheet.clientWidth;lastH=sheet.clientHeight;
  if(P.kind==='shots'){bindShots();paintFrame();paintDims();
   if(mq.matches){$$('.ph',sheet).forEach(p=>p.style.transition='none');setView(0,{instant:true})}
   else{after(1900,()=>setView(0,{instant:true}));after(5200,armAuto)}}
  else if(P.kind==='flow'){paintFrame();paintFlow();startFlow()}
  else{paintFrame();paintWip();const b=$('[data-preview]',sheet);b.addEventListener('click',()=>setFace(document.documentElement.dataset.face===b.dataset.preview?'neutral':b.dataset.preview));syncPreview()}
 });
}
sheet.addEventListener('click',onShots);
new IntersectionObserver(([e])=>{vis=e.isIntersecting;armAuto()},{threshold:.1}).observe(sheet);
let rzT=0;
new ResizeObserver(()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const w=sheet.clientWidth,h=sheet.clientHeight;
 if(!curP||!lastW||(Math.abs(w-lastW)<2&&Math.abs(h-lastH)<2))return;
 lastW=w;lastH=h;if(!$('.frame',sheet)||!$('.frame',sheet).childElementCount)return;
 sheet.classList.add('still');paintFrame();
 if(curP.kind==='shots'){paintDims();paintCallouts(viewIdx,0)}else if(curP.kind==='flow'){paintFlow();if(mq.matches)renderFlow(0,true)}else paintWip()},150)}).observe(sheet);
select('trainlog');
