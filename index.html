<!doctype html>
<html lang="en" data-face="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Before first paint: enable the JS-only hidden states and apply ?face=, so nothing flashes.
      ;(() => {
        const r = document.documentElement
        r.classList.add('js')
        const f = new URLSearchParams(location.search).get('face')
        // Keep in sync with AREAS: an area without a project is hidden, so its face is not linkable.
        if (['fullstack', 'ai', 'design'].includes(f)) r.dataset.face = f
      })()
    </script>
    <title>Josue Escobar — Full-stack &amp; AI engineer</title>
    <meta name="description" content="Engineer who builds across the stack — web, data, AI and 3D. Started in mechatronics, still building things that work." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://myrespository.josuee152.workers.dev/" />

    <!-- Link previews (LinkedIn, WhatsApp, X) read only this static HTML; they never run the app. -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://myrespository.josuee152.workers.dev/" />
    <meta property="og:title" content="Josue Escobar — Full-stack &amp; AI engineer" />
    <meta property="og:description" content="Engineer who builds across the stack — web, data, AI and 3D. Started in mechatronics, still building things that work." />
    <meta property="og:image" content="https://myrespository.josuee152.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Josue Escobar's portfolio: the headline, a 3D piece and the area cards" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Josue Escobar",
        "url": "https://myrespository.josuee152.workers.dev/",
        "jobTitle": "Full-stack and AI engineer",
        "email": "mailto:josuee152@gmail.com",
        "worksFor": { "@type": "Organization", "name": "Ecosat" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Universidad Autónoma de Chihuahua" },
        "sameAs": ["https://github.com/sue-btis", "https://mx.linkedin.com/in/escobarjosue"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
